
name: Refresh Spain tourism dashboard data

on:
  schedule:
    - cron: '18 8 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - run: pip install -r requirements.txt

      - name: Diagnose official data endpoints
        run: python diagnose_data_sources.py
        continue-on-error: true

      - name: Retrieve and validate official observations
        id: refresh
        run: python refresh.py
        continue-on-error: true

      - name: Commit updated dataset and retrieval status
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/snapshot.json data/latest_observations.csv
          git diff --cached --quiet || (git commit -m 'Automated Spain tourism data refresh' && git push)

      - name: Make source failures visible in workflow status
        if: steps.refresh.outcome == 'failure'
        run: exit 1
