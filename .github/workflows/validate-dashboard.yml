name: Validate Spain dashboard

on:
  push:
    branches: [main]
    paths:
      - 'app.py'
      - 'story_sections.py'
      - 'sources.py'
      - 'tests/**'
      - '.github/workflows/validate-dashboard.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dashboard dependencies
        run: pip install -r requirements.txt
      - name: Check Python syntax
        run: python -m compileall -q app.py story_sections.py sources.py refresh.py tests
      - name: Test data calculations and Streamlit rendering
        run: python -m unittest discover -s tests -v
