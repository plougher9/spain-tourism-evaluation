name: Validate Spain dashboard

on:
  push:
    branches: [main]
    paths:
      - 'app.py'
      - 'story_sections.py'
      - 'analysis_sections.py'
      - 'reader_story.py'
      - 'refresh_analysis.py'
      - 'data/analysis.json'
      - 'sources.py'
      - 'tests/**'
      - '.github/workflows/validate-dashboard.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dashboard dependencies
        run: pip install -r requirements.txt
      - name: Check Python syntax
        run: python -m compileall -q app.py story_sections.py analysis_sections.py reader_story.py sources.py refresh.py refresh_analysis.py tests
      - name: Test data calculations and Streamlit rendering
        run: python -m unittest discover -s tests -v
      - name: Smoke-test running Streamlit server
        shell: bash
        run: |
          streamlit run app.py --server.headless=true --server.address=127.0.0.1 --server.port=8501 > /tmp/streamlit.log 2>&1 &
          pid=$!
          trap 'kill $pid || true; cat /tmp/streamlit.log' EXIT
          for i in {1..30}; do
            if curl --silent --fail http://127.0.0.1:8501/_stcore/health; then
              echo "Streamlit server is responding"
              exit 0
            fi
            if ! kill -0 $pid 2>/dev/null; then
              echo "Streamlit process exited unexpectedly"
              exit 1
            fi
            sleep 1
          done
          echo "Streamlit server did not become healthy"
          exit 1
